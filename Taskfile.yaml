version: "3"

tasks:
  default:
    desc: "List all tasks"
    silent: true
    cmds:
      - task --list

  setup:
    desc: "Install all dependencies and pre-commit hooks"
    silent: true
    cmds:
      # Pre-commit setup
      - uv tool install pre-commit --with pre-commit-uv
      - pre-commit install
      - pre-commit install --hook-type commit-msg

      # Backend
      - cd apps/backend && go mod download

      # Frontend
      - cd apps/frontend && npm install

      # ML
      - cd apps/ml && uv sync

  backend:run:
    desc: "Run server on localhost:8080"
    silent: true
    cmds:
      - cd apps/backend && go mod tidy
      - cd apps/backend && go run ./cmd/api/main.go

  backend:db:init:
    desc: "Apply pending database migrations (golang-migrate up)"
    silent: true
    cmds:
      - cd apps/backend && go run ./cmd/migrate/main.go up

  backend:db:down:
    desc: "Roll back all database migrations (DESTRUCTIVE)"
    silent: true
    cmds:
      - cd apps/backend && go run ./cmd/migrate/main.go down

  backend:db:status:
    desc: "Print the active database migration version"
    silent: true
    cmds:
      - cd apps/backend && go run ./cmd/migrate/main.go status

  backend:test:
    desc: "Run backend tests and show coverage directly in terminal"
    silent: true
    cmds:
      - cd apps/backend && go test -cover ./...

  frontend:run:
    desc: "Run the frontend application"
    silent: true
    cmds:
      - cd apps/frontend && npm run dev

  frontend:test:
    desc: "Run frontend tests with terminal reporter"
    silent: true
    cmds:
      - cd apps/frontend && npm run test -- --coverage --coverageReporters="text"

  ml:test:
    desc: "Run ML tests and show coverage table in terminal"
    silent: true
    cmds:
      - cd apps/ml && uv run pytest --cov=src --cov-report=term --color=yes

  dev:run:
    desc: "Runs services: frontend, backend, postgres, migrate, pgadmin in docker containers.
      Before runnning ensure that all .env*.example copied to .env* (For developement) "
    silent: true
    cmds:
      - docker compose up

  test:all:
    desc: "Run tests and show coverage for all services"
    silent: true
    ignore_error: true
    cmds:
      - printf "\033[1;36m================== BACKEND (Go) ==================\033[0m\n"
      - task: backend:test

      - printf "\n\033[1;32m=================== ML (Python) ===================\033[0m\n"
      - task: ml:test

      - printf "\n\033[1;33m================= FRONTEND (TypeScript) =================\033[0m\n"
      - task: frontend:test
