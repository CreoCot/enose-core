version: "3"
env:
  PROJECT_ROOT: "{{.USER_WORKING_DIR}}"
  
tasks:
  default:
    desc: "List all tasks"
    silent: true
    cmds:
      - task --list

  setup:
    desc: "Install all dependencies and pre-commit hooks"
    silent: true
    cmds:
      # Pre-commit setup
      - uv tool install pre-commit --with pre-commit-uv
      - pre-commit install
      - pre-commit install --hook-type commit-msg

      # Backend
      - cd apps/backend && go mod download

      # Frontend
      - cd apps/frontend && npm install

      # ML
      - cd apps/ml && uv sync

  backend:run:
    desc: "Run server on localhost:8080"
    silent: true
    cmds:
      - cd apps/backend && go mod tidy
      - cd apps/backend && go run ./cmd/api/main.go
  
  db:up:
    desc: "Запустить только базу данных PostgreSQL для прогона тестов"
    cmds:
      - docker compose up -d postgres


  db:migrate-create:
    desc: "Создать новый файл миграции. Пример: task db:migrate-create seq=init"
    cmds:
      - |
        if [ -z "{{.seq}}" ]; then
          echo "Ошибка: Отсутствует параметр 'seq'. Пример: task db:migrate-create seq=name_of_migration"
          exit 1
        fi
      - >
        docker compose run --rm 
        migrate 
        create -ext sql -dir //migrations -seq "{{.seq}}"

  db:migrate-up:
    desc: "Накатить все незавершенные миграции (up)"
    cmds:
      - >
        docker compose run --rm 
        migrate 
        -path /migrations 
        -database postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-enose}?sslmode=disable 
        up

  db:migrate-down:
    desc: "Откатить последнюю или все миграции (down)"
    cmds:
      - >
        docker compose run --rm 
        migrate 
        -path /migrations 
        -database postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-enose}?sslmode=disable 
        down 1


  frontend:run:
    desc: "Run the frontend application"
    silent: true
    cmds:
      - cd apps/frontend && npm run dev

  dev:run:
    desc: "Runs services: frontend, backend, postgres, migrate, pgadmin in docker containers.
      Before runnning ensure that all .env*.example copied to .env* (For developement) "
    silent: true
    cmds:
      - docker compose up
