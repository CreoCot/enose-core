version: "3"
env:
  PROJECT_ROOT: "{{.USER_WORKING_DIR}}"

includes:
  backend:
    taskfile: ./apps/backend/Taskfile.yaml
    dir: ./apps/backend
  frontend:
    taskfile: ./apps/frontend/Taskfile.yaml
    dir: ./apps/frontend
  ml:
    taskfile: ./apps/ml/Taskfile.yaml
    dir: ./apps/ml

tasks:
  default:
    silent: true
    cmds:
      - >
        printf "\033[1;34m💡 Tip:\033[0m Filter tasks by namespace:
        \033[1;36mtask backend:<cmd>\033[0m,
        \033[1;33mtask frontend:<cmd>\033[0m,
        \033[1;32mtask ml:<cmd>\033[0m\n\n"
      - task --list

  setup:
    desc: "Install all dependencies and pre-commit hooks"
    silent: true
    cmds:
      - uv tool install pre-commit --with pre-commit-uv
      - pre-commit install
      - pre-commit install --hook-type commit-msg
      - task: backend:setup
      - task: frontend:setup
      - task: ml:setup

  # ---------------------------------------------------------------------------
  # Docker Compose
  # ---------------------------------------------------------------------------

  start:
    desc: |
      Runs all services in Docker: frontend, backend, parser, postgres, pgadmin, migrations.
      Before running ensure root .env and apps/backend/.env exist (copy from *.example).
    preconditions:
      - sh: "docker info"
        msg: "Docker daemon is not running. Please start Docker Desktop or your local runtime."
      - sh: "test -f .env"
        msg: "Missing root .env file. Please run: cp .env.example .env"
      - sh: "test -f apps/backend/.env"
        msg: "Missing backend .env file. Please run: cp apps/backend/.env.example apps/backend/.env"
    silent: true
    cmds:
      - docker compose up --build

  stop:
    desc: "Stops all Docker services"
    silent: true
    cmds:
      - docker compose down

  # ---------------------------------------------------------------------------
  # Database migrations (requires Docker: task db:up first)
  # ---------------------------------------------------------------------------

  db:up:
    desc: "Start only PostgreSQL (for running tests or migrations locally)"
    cmds:
      - docker compose up -d postgres

  db:migrate-create:
    desc: "Create a new migration file. Example: task db:migrate-create seq=add_users_table"
    cmds:
      - |
        if [ -z "{{.seq}}" ]; then
          echo "Error: missing 'seq' parameter. Example: task db:migrate-create seq=add_users_table"
          exit 1
        fi
      - >
        docker compose run --rm
        migrate
        create -ext sql -dir /migrations -seq "{{.seq}}"

  db:migrate-up:
    desc: "Apply all pending migrations (up)"
    cmds:
      - >
        docker compose run --rm
        migrate
        -path /migrations
        -database postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-enose}?sslmode=disable
        up

  db:migrate-down:
    desc: "Roll back the last migration (down 1)"
    cmds:
      - >
        docker compose run --rm
        migrate
        -path /migrations
        -database postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-enose}?sslmode=disable
        down 1

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------

  test:
    desc: "Run tests for all services in parallel"
    silent: true
    deps:
      - task: backend:test
      - task: ml:test
      - task: frontend:test

  # ---------------------------------------------------------------------------
  # dev:auth:* — manual testing of auth endpoints
  # Requires running backend: task backend:run (or task start)
  # Cookies are stored in /tmp/enose-cookies*.txt
  # ---------------------------------------------------------------------------

  dev:auth:register:
    desc: "Register a test admin user"
    cmds:
      - >
        curl -s -X POST http://localhost:8080/api/v1/auth/register
        -H "Content-Type: application/json"
        -d '{"username":"admin","password":"password123","role":"admin"}'
        | jq

  dev:auth:register-user:
    desc: "Register a test operator user"
    cmds:
      - >
        curl -s -X POST http://localhost:8080/api/v1/auth/register
        -H "Content-Type: application/json"
        -d '{"username":"operator","password":"password123","role":"operator"}'
        | jq

  dev:auth:login:
    desc: "Login as admin and save cookie to /tmp/enose-cookies.txt"
    cmds:
      - >
        curl -s -c /tmp/enose-cookies.txt
        -X POST http://localhost:8080/api/v1/auth/login
        -H "Content-Type: application/json"
        -d '{"username":"admin","password":"password123"}'
        | jq
      - echo "Cookie saved to /tmp/enose-cookies.txt"

  dev:auth:login-user:
    desc: "Login as operator and save cookie to /tmp/enose-cookies-user.txt"
    cmds:
      - >
        curl -s -c /tmp/enose-cookies-user.txt
        -X POST http://localhost:8080/api/v1/auth/login
        -H "Content-Type: application/json"
        -d '{"username":"operator","password":"password123"}'
        | jq
      - echo "Cookie saved to /tmp/enose-cookies-user.txt"

  dev:auth:me:
    desc: "Get current user info (admin)"
    cmds:
      - >
        curl -s -b /tmp/enose-cookies.txt
        http://localhost:8080/api/v1/auth/me
        | jq

  dev:auth:logout:
    desc: "Logout (clear cookie)"
    cmds:
      - >
        curl -s -b /tmp/enose-cookies.txt -c /tmp/enose-cookies.txt
        -X POST http://localhost:8080/api/v1/auth/logout
        | jq
      - rm -f /tmp/enose-cookies.txt
      - echo "Logged out"

  # ---------------------------------------------------------------------------
  # dev:entries:* — testing measurement list endpoints
  # ---------------------------------------------------------------------------

  dev:entries:admin:
    desc: "List all measurements as admin"
    cmds:
      - >
        curl -s -b /tmp/enose-cookies.txt
        http://localhost:8080/api/v1/entries
        | jq

  dev:entries:user:
    desc: "List measurements as operator (own only)"
    cmds:
      - >
        curl -s -b /tmp/enose-cookies-user.txt
        http://localhost:8080/api/v1/entries
        | jq

  dev:entries:no-cookie:
    desc: "Check that a request without a cookie returns 401"
    cmds:
      - >
        curl -s http://localhost:8080/api/v1/entries | jq

  # ---------------------------------------------------------------------------
  # dev:upload:* — testing file upload and per-measurement data endpoints
  # Usage: task dev:upload:file file=path/to/file.xml
  #        task dev:upload:table id=1
  #        task dev:upload:plots id=1
  # ---------------------------------------------------------------------------

  dev:upload:file:
    desc: "Upload a measurement file as admin. Example: task dev:upload:file file=sample.xml"
    cmds:
      - |
        if [ -z "{{.file}}" ]; then
          echo "Error: missing 'file' parameter. Example: task dev:upload:file file=sample.xml"
          exit 1
        fi
      - >
        curl -s -b /tmp/enose-cookies.txt
        -X POST http://localhost:8080/api/v1/upload
        -F "file=@{{.file}}"
        | jq

  dev:upload:table:
    desc: "Get table data for a measurement by ID. Example: task dev:upload:table id=1"
    cmds:
      - |
        if [ -z "{{.id}}" ]; then
          echo "Error: missing 'id' parameter. Example: task dev:upload:table id=1"
          exit 1
        fi
      - >
        curl -s -b /tmp/enose-cookies.txt
        http://localhost:8080/api/v1/table/{{.id}}
        | jq '{size: .size, rows: (.data | length)}'

  dev:upload:plots:
    desc: "Get plot data for a measurement by ID. Example: task dev:upload:plots id=1"
    cmds:
      - |
        if [ -z "{{.id}}" ]; then
          echo "Error: missing 'id' parameter. Example: task dev:upload:plots id=1"
          exit 1
        fi
      - >
        curl -s -b /tmp/enose-cookies.txt
        http://localhost:8080/api/v1/plots/{{.id}}
        | jq '{size: .size, timestamps: (.timestamps | length), sensors: (.data | length)}'

  # ---------------------------------------------------------------------------
  # dev:parser:* — testing the parser service directly
  # ---------------------------------------------------------------------------

  dev:parser:health:
    desc: "Check parser service health (http://localhost:8001/health)"
    cmds:
      - curl -s http://localhost:8001/health | jq

  dev:parser:parse:
    desc: "Send a file directly to the parser service. Example: task dev:parser:parse file=sample.xml"
    cmds:
      - |
        if [ -z "{{.file}}" ]; then
          echo "Error: missing 'file' parameter. Example: task dev:parser:parse file=sample.xml"
          exit 1
        fi
      - >
        curl -s -X POST http://localhost:8001/measurements/parse
        -H "X-API-Key: ${PARSER_API_KEY:-example_api_key}"
        -F "file=@{{.file}}"
        | jq '{measurement_name: .measurement_name, sensors: (.sensors | length), data_points: (.data_points | length)}'
