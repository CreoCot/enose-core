version: "3"
env:
  PROJECT_ROOT: "{{.USER_WORKING_DIR}}"


tasks:
  default:
    silent: true
    cmds:
      - >
        printf "\033[1;34m💡 Tip:\033[0m Filter tasks by namespace:
        \033[1;36mtask b\033[0m (backend),
        \033[1;33mtask f\033[0m (frontend),
        \033[1;32mtask m\033[0m (ml)\n\n"
      - task --list

  setup:
    desc: "Install all dependencies and pre-commit hooks"
    silent: true
    cmds:
      - uv tool install pre-commit --with pre-commit-uv
      - pre-commit install
      - pre-commit install --hook-type commit-msg
      - task: backend:setup
      - task: frontend:setup
      - task: ml:setup

  dev:run:
    desc: "Runs all services"
    summary: |
      Runs all microservices locally

      # Frontend
      - cd apps/frontend && npm install

      # ML
      - cd apps/ml && uv sync

  backend:run:
    desc: "Run server on localhost:8080"
    silent: true
    cmds:
      - cd apps/backend && go mod tidy
      - cd apps/backend && go run ./cmd/api/main.go

  db:up:
    desc: "Запустить только базу данных PostgreSQL для прогона тестов"
    cmds:
      - docker compose up -d postgres


  db:migrate-create:
    desc: "Создать новый файл миграции. Пример: task db:migrate-create seq=init"
    cmds:
      - |
        if [ -z "{{.seq}}" ]; then
          echo "Ошибка: Отсутствует параметр 'seq'. Пример: task db:migrate-create seq=name_of_migration"
          exit 1
          fi
      - >
        docker compose run --rm
        migrate
        create -ext sql -dir //migrations -seq "{{.seq}}"

  db:migrate-up:
    desc: "Накатить все незавершенные миграции (up)"
    cmds:
      - >
        docker compose run --rm
        migrate
        -path /migrations
        -database postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-enose}?sslmode=disable
        up

  db:migrate-down:
    desc: "Откатить последнюю или все миграции (down)"
    cmds:
      - >
        docker compose run --rm
        migrate
        -path /migrations
        -database postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-enose}?sslmode=disable
        down 1


  test:
    desc: "Run tests and show coverage for all services"
    silent: true
    cmds:
      - "{{.TASK_EXE}} test:parallel -o group"

  start:
    desc: |
      Runs services: frontend, backend, postgres, migrate, pgadmin in docker containers.
      Before running ensure that all .env*.example copied to .env* (For development)

      ⚠️ IMPORTANT:
      Before running this, ensure you have copied all `.env.example`
      files to `.env` in their respective directories.
    preconditions:
      - sh: "docker info"
        msg: "Docker daemon is not running. Please start Docker Desktop or your local runtime."
      - sh: "test -f .env"
        msg: "Missing root .env file (single source of truth for Docker Compose). Please run: cp .env.example .env"
      - sh: "test -f apps/backend/.env"
        msg: "Missing backend .env file. Please run: cp apps/backend/.env.example apps/backend/.env"
    silent: true
    cmds:
      - docker compose up

  stop:
    desc: "Stops all Docker services"
    silent: true
    cmds:
      - docker compose down

  test:parallel:
    silent: true
    deps:
      - task: backend:test
      - task: ml:test
      - task: frontend:test

  # ---------------------------------------------------------------------------
  # dev:auth:* — ручное тестирование auth-эндпоинтов во время разработки
  # Требует запущенного бэкенда: task backend:run
  # Куки сохраняются в /tmp/enose-cookies.txt
  # ---------------------------------------------------------------------------

  dev:auth:register:
    desc: "Зарегистрировать тестового admin-пользователя"
    cmds:
      - >
        curl -s -X POST http://localhost:8080/api/v1/auth/register
        -H "Content-Type: application/json"
        -d '{"username":"admin","password":"password123","role":"admin"}'
        | jq

  dev:auth:register-user:
    desc: "Зарегистрировать тестового operator-пользователя"
    cmds:
      - >
        curl -s -X POST http://localhost:8080/api/v1/auth/register
        -H "Content-Type: application/json"
        -d '{"username":"operator","password":"password123","role":"operator"}'
        | jq

  dev:auth:login:
    desc: "Войти как admin и сохранить куку в /tmp/enose-cookies.txt"
    cmds:
      - >
        curl -s -c /tmp/enose-cookies.txt
        -X POST http://localhost:8080/api/v1/auth/login
        -H "Content-Type: application/json"
        -d '{"username":"admin","password":"password123"}'
        | jq
      - echo "Cookie saved to /tmp/enose-cookies.txt"

  dev:auth:login-user:
    desc: "Войти как operator и сохранить куку в /tmp/enose-cookies-user.txt"
    cmds:
      - >
        curl -s -c /tmp/enose-cookies-user.txt
        -X POST http://localhost:8080/api/v1/auth/login
        -H "Content-Type: application/json"
        -d '{"username":"operator","password":"password123"}'
        | jq
      - echo "Cookie saved to /tmp/enose-cookies-user.txt"

  dev:auth:me:
    desc: "Получить информацию о текущем пользователе (admin)"
    cmds:
      - >
        curl -s -b /tmp/enose-cookies.txt
        http://localhost:8080/api/v1/auth/me
        | jq

  dev:auth:logout:
    desc: "Выйти (удалить куку)"
    cmds:
      - >
        curl -s -b /tmp/enose-cookies.txt -c /tmp/enose-cookies.txt
        -X POST http://localhost:8080/api/v1/auth/logout
        | jq
      - rm -f /tmp/enose-cookies.txt
      - echo "Logged out"

  dev:auth:entries-admin:
    desc: "Получить все записи как admin (все измерения)"
    cmds:
      - >
        curl -s -b /tmp/enose-cookies.txt
        http://localhost:8080/api/v1/entries
        | jq

  dev:auth:entries-user:
    desc: "Получить записи как operator (только свои измерения)"
    cmds:
      - >
        curl -s -b /tmp/enose-cookies-user.txt
        http://localhost:8080/api/v1/entries
        | jq

  dev:auth:no-cookie:
    desc: "Проверить, что без куки приходит 401"
    cmds:
      - >
        curl -s http://localhost:8080/api/v1/entries | jq
