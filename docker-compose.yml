services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: enose-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-enose}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: enose-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Go Backend
  migrate:
    container_name: enose-migrate-prod
    image: migrate/migrate:v4.19.1
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
    volumes:
      - ./apps/backend/database/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy

    command:
      - -path=/migrations
      - -database=postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-enose}?sslmode=disable
      - up

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: development
    container_name: enose-backend
    volumes:
      - ./apps/backend:/app
      - /app/tmp
    environment:
      PORT: "8080"
      ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-fhu578djt4jdm%3+}
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      target: development
    container_name: enose-frontend
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.react-router
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

  parser:
    build:
      context: ./apps/parser
      dockerfile: Dockerfile
    container_name: enose-parser
    restart: unless-stopped
    ports:
      - "${PARSER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
