services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: enose-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-enose}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: enose-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy

  # Go Backend
  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.migrate
    container_name: enose-migrate
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    command: ["go", "run", "./cmd/migrate/main.go", "up"]

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: enose-backend
    volumes:
      - ./apps/backend:/app  # Монтируем исходники для hot-reload
      - /app/tmp
    environment:
      PORT: "8080"
      ENV: development
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  # React Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: enose-frontend
    volumes:
      - ./apps/frontend:/app  # Монтируем исходники
      - /app/node_modules     # Исключаем node_modules из хоста
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
