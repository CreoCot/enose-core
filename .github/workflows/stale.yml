name: 🧹 Close Stale Issues
on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v8
        with:
          stale-issue-message: 'This issue has been inactive for 30 days. As per Agile guidelines, if it is not picked up in the next 7 days, it will be closed.'
          stale-issue-label: 'stale'
          days-before-issue-stale: 30
          days-before-issue-close: 7
          exempt-issue-labels: 'epic,P0 (Critical)'
