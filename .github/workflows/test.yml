name: Run tests

on:
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck (TypeScript validation)
        run: npm run typecheck

      - name: Run frontend tests with coverage
        run: npm test -- --coverage

      - name: Upload Frontend Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/frontend/coverage/clover.xml
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.work'
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Install dependencies
        run: go mod download

      - name: Run backend tests
        run: go test -v -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload Backend Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/backend/coverage.out
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}

  test-ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: apps/ml/.python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/ml/uv.lock

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run ML tests
        run: uv run pytest --cov=src --cov-report=xml

      - name: Upload ML Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: apps/ml/coverage.xml
          flags: ml
          token: ${{ secrets.CODECOV_TOKEN }}
