name: Deploy to Production

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Download code from repository
        uses: actions/checkout@v7

      - name: Start Docker Compose build
        run: |
          docker compose -f docker-compose.prod.yml up -d --build
          docker image prune -f
