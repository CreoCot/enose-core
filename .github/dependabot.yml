version: 2
updates:
  - package-ecosystem: 'npm'
    directory: "/apps/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      frontend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
    groups:
      backend-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/apps/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      backend-deps:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/apps/ml"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      ml-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions-deps:
        patterns:
          - "*"
