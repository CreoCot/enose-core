server {
    listen 80;

    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /grafana {
        set $upstream_grafana http://grafana:3000;
        proxy_pass $upstream_grafana;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /grafana/api/live {
        set $upstream_grafana_live http://grafana:3000;
        proxy_pass $upstream_grafana_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    location /swagger/ {
        set $upstream_backend_swagger http://backend:8080;
        proxy_pass $upstream_backend_swagger;
        proxy_set_header Host $http_host;
    }

    # Единая страница со всеми 4 OpenAPI-спеками (бэкенд + 3 микросервиса) —
    # см. /api-docs/index.html. Сами сервисы наружу не смотрят и своих
    # /docs не отдают под-путём (FastAPI без root_path сломал бы относительные
    # ссылки) — поэтому наружу проксируем только сырой openapi.json, а UI один
    # общий, статический.
    location = /api-docs/parser.json {
        set $upstream_parser_spec http://parser:8001;
        proxy_pass $upstream_parser_spec/openapi.json;
    }

    location = /api-docs/report.json {
        set $upstream_report_spec http://report:8002;
        proxy_pass $upstream_report_spec/openapi.json;
    }

    location = /api-docs/ml.json {
        set $upstream_ml_spec http://ml:8003;
        proxy_pass $upstream_ml_spec/openapi.json;
    }

    location /api-docs/ {
        alias /usr/share/nginx/api-docs/;
        index index.html;
    }

    location / {
        set $upstream_frontend http://frontend:8080;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
