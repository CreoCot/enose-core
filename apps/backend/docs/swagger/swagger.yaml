basePath: /
definitions:
  handlers.ErrorResponse:
    properties:
      error:
        example: internal_error
        type: string
      message:
        example: Something went wrong
        type: string
    type: object
  handlers.HealthResponse:
    properties:
      database:
        description: Статус подключения к БД
        example: ok
        type: string
      status:
        description: Общий статус приложения
        example: OK
        type: string
      timestamp:
        description: Время генерации ответа
        example: Sun, 14 Jun 2026 16:25:56 UTC
        type: string
      uptime:
        description: Время работы с момента запуска
        example: 55.332075718s
        type: string
      version:
        description: Версия сборки
        example: 1.0.0-mvp
        type: string
    type: object
  handlers.MeasurementsItem:
    properties:
      date:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.PlotResponse:
    properties:
      data:
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      size:
        type: integer
      timestamps:
        items:
          type: number
        type: array
    type: object
  handlers.TableResponse:
    properties:
      data:
        items:
          items:
            format: float64
            type: number
          type: array
        type: array
      size:
        description: Массив временных рядов (каждая строка — один сенсор)
        example: 2
        type: integer
    type: object
  handlers.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  handlers.messageResponse:
    properties:
      message:
        type: string
    type: object
  handlers.profileResponse:
    properties:
      count:
        type: integer
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  handlers.registerRequest:
    properties:
      email:
        type: string
      full_name:
        type: string
      password:
        minLength: 8
        type: string
      role:
        type: string
      username:
        maxLength: 64
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  handlers.userResponse:
    properties:
      created_at:
        type: string
      email:
        type: string
      full_name:
        type: string
      id:
        type: integer
      role:
        type: string
      username:
        type: string
    type: object
  services.FlexibleTime:
    properties:
      time.Time:
        type: string
    type: object
  services.MLAnalyzeResponse:
    properties:
      computed_at:
        type: string
      features:
        items:
          $ref: '#/definitions/services.MLFeatureItem'
        type: array
    type: object
  services.MLFeatureItem:
    properties:
      name:
        type: string
      sensor_id:
        type: integer
      value:
        type: number
    type: object
  services.ParsedDataPoint:
    properties:
      sensor_position:
        type: integer
      time_offset_s:
        type: number
      value:
        type: number
    type: object
  services.ParsedMeasurement:
    properties:
      data_points:
        items:
          $ref: '#/definitions/services.ParsedDataPoint'
        type: array
      description:
        type: string
      device_serial:
        type: string
      device_type_code:
        type: string
      interval_ms:
        type: integer
      measurement_name:
        type: string
      measurement_object:
        type: string
      sensors:
        items:
          $ref: '#/definitions/services.ParsedSensor'
        type: array
      start_time:
        $ref: '#/definitions/services.FlexibleTime'
    type: object
  services.ParsedSensor:
    properties:
      label:
        type: string
      position:
        type: integer
      unit:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: dev@enose-core.local
    name: Enose Core Team
  description: API for e-nose system
  license:
    name: Proprietary
    url: http://swagger.io/licenses/
  termsOfService: http://swagger.io/terms/
  title: Enose Core API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Логин и пароль
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.loginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.messageResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Вход в систему
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.messageResponse'
      summary: Выход из системы
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.profileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Информация о текущем пользователе
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: Данные пользователя
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.registerRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Регистрация нового пользователя
      tags:
      - Auth
  /api/v1/delete/{id}:
    delete:
      description: Удаляет измерение; параметры датчиков и точки данных удаляются
        каскадно
      parameters:
      - description: ID измерения
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Измерение удалено
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Удалить измерение
      tags:
      - Measurements
  /api/v1/entries:
    get:
      description: Возвращает массив {id, name, start_time}
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/handlers.MeasurementsItem'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Список измерений
      tags:
      - Measurements
  /api/v1/features/{id}:
    get:
      description: Считает признаки кривых сенсоров через ML-сервис и возвращает их
      parameters:
      - description: ID измерения
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.MLAnalyzeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Признаки измерения
      tags:
      - Measurements
  /api/v1/health:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает статус сервиса, версию, время работы и состояние БД.
        Используется для liveness/readiness probes и мониторинга.
      produces:
      - application/json
      responses:
        "200":
          description: Сервер работает
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
        "500":
          description: Внутренняя ошибка
          schema:
            $ref: '#/definitions/handlers.HealthResponse'
      summary: Проверка работоспособности бэкенда
      tags:
      - Heartbeat
  /api/v1/plots/{id}:
    get:
      description: Возвращает временные ряды каждого сенсора измерения для построения
        графиков
      parameters:
      - description: ID измерения
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PlotResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Графики данных измерения
      tags:
      - Measurements
  /api/v1/report/{id}:
    get:
      description: Собирает данные измерения, отправляет их в report-сервис и возвращает
        готовый PDF
      parameters:
      - description: ID измерения
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/pdf
      responses:
        "200":
          description: PDF-файл отчёта
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: PDF-отчёт по измерению
      tags:
      - Measurements
  /api/v1/table:
    get:
      consumes:
      - application/json
      description: |-
        Возвращает матрицу временных рядов от пьезосенсоров для визуализации.
        Каждая строка матрицы — данные одного сенсора.
      produces:
      - application/json
      responses:
        "200":
          description: Пример ответа
          schema:
            $ref: '#/definitions/handlers.TableResponse'
        "500":
          description: Ошибка генерации данных
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Получить демо-таблицу данных сенсоров
      tags:
      - Data
  /api/v1/table/{id}:
    get:
      description: 'Возвращает данные сенсоров измерения в табличном виде: каждая
        строка — момент времени, первый столбец — время, остальные — значения сенсоров'
      parameters:
      - description: ID измерения
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.TableResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Таблица данных измерения
      tags:
      - Measurements
  /api/v1/upload:
    post:
      consumes:
      - multipart/form-data
      description: Принимает файл (CSV, XML, XLSX), отправляет в parser-сервис и возвращает
        распарсенные данные
      parameters:
      - description: Файл измерения (CSV, XML или XLSX)
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/services.ParsedMeasurement'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Загрузить файл измерения
      tags:
      - Measurements
schemes:
- http
securityDefinitions:
  BearerAuth:
    description: JWT-token (TBA)
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
