services:
  postgres:
    container_name: enose-postgres-prod
    ports:
      - "5432:5432"
    restart: always

  migrate:
    container_name: enose-migrate-prod

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/enose-core-backend:latest
    container_name: enose-backend-prod
    environment:
      ENV: staging
      JWT_SECRET: enose-jwt-prod-secret-2025
      ALLOWED_ORIGINS: http://10.93.27.29
      PARSER_URL: http://parser:8001
      PARSER_API_KEY: enose-parser-secret
      REPORT_URL: http://report:8002
      REPORT_API_KEY: enose-report-secret
      ML_URL: http://ml:8003
      ML_API_KEY: enose-ml-secret
    depends_on:
      migrate:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
    restart: always

  parser:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/enose-core-parser:latest
    container_name: enose-parser-prod
    environment:
      PARSER_API_KEY: enose-parser-secret
    restart: always

  report:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/enose-core-report:latest
    container_name: enose-report-prod
    environment:
      REPORT_API_KEY: enose-report-secret
    restart: always

  ml:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/enose-core-ml:latest
    container_name: enose-ml-prod
    environment:
      ML_API_KEY: enose-ml-secret
    restart: always

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/enose-core-frontend:latest
    container_name: enose-frontend-prod
    restart: always

  victoriametrics:
    container_name: enose-victoriametrics-prod
    restart: always

  grafana:
    container_name: enose-grafana-prod
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-super_secret_change_me}
      GF_SERVER_ROOT_URL: "http://10.93.27.29/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"

  proxy:
    image: nginx:alpine
    container_name: enose-proxy-prod
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - grafana
    restart: always
