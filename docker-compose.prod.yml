services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: enose-postgres-prod
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-enose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Go Backend
  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    container_name: enose-migrate-prod
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "/app/migrate", "up" ]

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    container_name: enose-backend-prod
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always

  # React Frontend
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: enose-frontend-prod
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
