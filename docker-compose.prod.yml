services:
  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: enose-postgres-prod
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-enose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  # Go Backend
  migrate:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    container_name: enose-migrate-prod
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
    depends_on:
      postgres:
        condition: service_healthy
    command: [ "/app/migrate", "up" ]

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      target: production
    container_name: enose-backend-prod
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
      ALLOWED_ORIGINS: http://localhost,http://10.93.27.29
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: always

  # React Frontend (Node.js)
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://10.93.27.29
    container_name: enose-frontend-prod
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: enose-proxy-prod
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data:
