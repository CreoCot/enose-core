services:
  postgres:
    image: postgres:15-alpine
    container_name: enose-postgres-prod
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-enose}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  migrate:
    container_name: enose-migrate-prod
    image: migrate/migrate:v4.19.1
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
    volumes:
      - ./apps/backend/database/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -path=/migrations
      - -database=postgres://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-enose}?sslmode=disable
      - up

  backend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/enose-core-backend:latest
    container_name: enose-backend-prod
    environment:
      PORT: "8080"
      ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-enose}
      DATABASE_SSLMODE: disable
      JWT_SECRET: enose-jwt-prod-secret-2025
      ALLOWED_ORIGINS: http://10.93.27.29
      PARSER_URL: http://parser:8001
      PARSER_API_KEY: enose-parser-secret
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      parser:
        condition: service_healthy
    restart: always

  parser:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/enose-core-parser:latest
    container_name: enose-parser-prod
    environment:
      PARSER_API_KEY: enose-parser-secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/enose-core-frontend:latest
    container_name: enose-frontend-prod
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: enose-proxy-prod
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: always

volumes:
  postgres_data:
